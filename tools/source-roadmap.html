<body>
  <div id="root"></div>
  <noscript>
    <div style="min-height:100vh;background:#0B1220;color:#E9EEF8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;">This roadmap needs JavaScript enabled.</div>
  </noscript>
  <script>
  (function () {
    function showStartupError(detail) {
      var root = document.getElementById('root');
      if (!root || root.children.length) return;
      var safeDetail = String(detail || 'Unknown startup error').replace(/[<>]/g, '');
      root.innerHTML = '<div style="min-height:100vh;background:#0B1220;color:#E9EEF8;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center;"><div style="max-width:560px;"><div style="font-size:20px;font-weight:800;color:#FFB454;margin-bottom:8px;">Roadmap could not start</div><div style="color:#C9D4E8;line-height:1.55;">Refresh the file. If it still happens, use the backup file and share this message:</div><div style="margin-top:12px;color:#94A2BE;font-family:monospace;font-size:12px;word-break:break-word;">' + safeDetail + '</div></div></div>';
    }
    window.addEventListener('error', function (event) { setTimeout(function () { showStartupError(event && event.message); }, 0); });
    window.addEventListener('unhandledrejection', function (event) { setTimeout(function () { showStartupError(event && event.reason); }, 0); });
    window.setTimeout(function () {
      var root = document.getElementById('root');
      if (root && !root.children.length) showStartupError('The app took too long to render.');
    }, 7000);
  }());
  </script>

// ─── DAY SCHEDULER ────────────────────────────────────────────────────────────
// Turns each week's tasks into a realistic DAY-BY-DAY plan.
//   • Reads each task's own time estimate (timeEst) so the hours are personalised
//     to the actual work — not a flat number.
//   • Packs tasks into focused study days of roughly TARGET_HRS each.
//   • A task bigger than a single day is split across consecutive days by its
//     steps, so you always know exactly which steps to do on which day.
// The result drives the new  Phase → Week → Day → Task → Steps  navigation.

const TARGET_HRS = 3;   // the ideal length of one focused study day
const MAX_HRS    = 4;   // a day won't be packed beyond this

// Pull a realistic hour figure out of a free-text estimate like
// "2.5 hours", "30 minutes", "4–5 hours", "Full day", "8 hours across the week".
function parseTaskHours(timeEst) {
  if (!timeEst) return 2;
  const t = String(timeEst).toLowerCase();
  const hr = t.match(/(\d+(?:\.\d+)?)\s*(?:[–-]\s*(\d+(?:\.\d+)?))?\s*hour/);
  if (hr) {
    const a = parseFloat(hr[1]);
    const b = hr[2] ? parseFloat(hr[2]) : null;
    return b ? (a + b) / 2 : a;
  }
  const mn = t.match(/(\d+(?:\.\d+)?)\s*min/);
  if (mn) return parseFloat(mn[1]) / 60;
  if (t.includes("full day")) return 6;
  if (t.includes("week")) return 5;
  const any = t.match(/(\d+(?:\.\d+)?)/);
  return any ? parseFloat(any[1]) : 2;
}

const round1 = (n) => Math.round(n * 10) / 10;

// Build the ordered list of days for one week.
// Each day = { dayNum, hours, items: [ { task, steps, hours, partIndex, partCount } ] }
function buildWeekDays(week) {
  const days = [];
  let day = { items: [], hours: 0 };
  const flush = () => { if (day.items.length) { days.push(day); day = { items: [], hours: 0 }; } };

  (week.tasks || []).forEach(task => {
    const total = parseTaskHours(task.timeEst);
    const steps = task.steps || [];

    if (total <= MAX_HRS) {
      // Small/medium task: keep it whole. Start a new day if it won't fit.
      if (day.items.length && day.hours + total > MAX_HRS) flush();
      day.items.push({ task, steps, hours: total });
      day.hours += total;
      if (day.hours >= TARGET_HRS) flush();
      return;
    }

    // Large task: spread its steps across consecutive whole days.
    flush();
    const perStep = steps.length ? total / steps.length : total;
    let i = 0;
    while (i < steps.length) {
      let take = Math.max(1, Math.floor(MAX_HRS / perStep));
      take = Math.min(take, steps.length - i);
      const chunk = steps.slice(i, i + take);
      days.push({ items: [{ task, steps: chunk, hours: chunk.length * perStep }], hours: chunk.length * perStep });
      i += take;
    }
  });
  flush();

  // Number the days and label each task-part (Part 1/2 …) where a task spans days.
  const partCounts = {};
  days.forEach(d => d.items.forEach(it => { partCounts[it.task.id] = (partCounts[it.task.id] || 0) + 1; }));
  const seen = {};
  days.forEach((d, di) => {
    d.dayNum = di + 1;
    d.hours = round1(d.hours);
    d.items.forEach(it => {
      it.partCount = partCounts[it.task.id];
      seen[it.task.id] = (seen[it.task.id] || 0) + 1;
      it.partIndex = seen[it.task.id];
    });
  });
  return days;
}

// ─── STORAGE SHIM ─────────────────────────────────────────────────────────────
// Uses the Claude-artifact storage API when available, otherwise falls back to
// localStorage so progress also persists when this file is opened directly in
// a browser.
const appStorage = {
  async get(key) {
    if (window.storage && typeof window.storage.get === "function") {
      return await window.storage.get(key);
    }
    try {
      const v = window.localStorage.getItem(key);
      return v === null ? null : { value: v };
    } catch { return null; }
  },
  async set(key, value) {
    if (window.storage && typeof window.storage.set === "function") {
      return await window.storage.set(key, value);
    }
    try { window.localStorage.setItem(key, value); } catch {}
  }
};
